spring.application.name=quora.clone
logging.level.org.springframework.web=debug
spring.datasource.name=Quora
spring.datasource.password=9926430125
spring.datasource.url=jdbc:mysql://localhost:3306/Quora
spring.datasource.username=root
logging.level.org.springframework.r2dbc=DEBUG
#spring.r2dbc.password=9926430125
#spring.r2dbc.url=r2dbc:mysql://localhost:3306/Quora
#spring.r2dbc.username=root
# we can see sql statement being executed
spring.jpa.show-sql=true
#spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


management.endpoints.web.exposure.include=*

# Log file name and location
logging.file.name=/logs/application.log

# Log level
logging.level.root=DEBUG

#database connection pool size
spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000


spring.boot.jvm.arguments=-Xms1g -Xmx3g

